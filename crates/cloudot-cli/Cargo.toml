[package]
name = "cloudot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cloudot"
path = "src/main.rs"

[dependencies]
cloudot-core = { path = "../cloudot-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = "1.0.229"
