# Fish shell。
#
# 只纳管手写的配置，不纳管 fish 自己维护的运行时文件：
#
# - `fish_variables` 不纳管。它是 universal variables 的存储，fish 会在你跑
#   `set -U`（以及 web 配置界面改主题）时**自行重写**。同步它等于让两台机器
#   互相覆盖运行时状态，而且 fish 是替换写入，软链会被顶成实体文件。
# - `completions/` 里多数是工具自己装进去的（本机的 copilot.fish 就是），
#   跟着机器走比跟着人走更合适，所以也不纳管。
#
# `conf.d/` 与 `functions/` 下的文件是逐个列的，不是整目录链接 —— 当前版本
# 只支持单文件纳管（见 link.rs），而且整目录链接会把上面那些运行时文件一起带上。
# 新增自定义函数时要在这里补一行。
id   = "fish"
name = "Fish"

detect = [
  "~/.config/fish/config.fish",
  "/opt/homebrew/bin/fish",
  "/usr/local/bin/fish",
]

[[paths]]
path     = "~/.config/fish/config.fish"
strategy = "symlink"

[[paths]]
path     = "~/.config/fish/conf.d/fish_frozen_theme.fish"
strategy = "symlink"

[[paths]]
path     = "~/.config/fish/functions/fish_prompt.fish"
strategy = "symlink"
